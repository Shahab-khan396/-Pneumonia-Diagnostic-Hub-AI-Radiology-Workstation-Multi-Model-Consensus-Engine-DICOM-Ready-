services:
  - type: web
    name: pneumonia-hub-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: HF_SPACE_URL
        value: https://shahabkhan396-pneumonia-hub.hf.space
      - key: HF_API_TOKEN

        sync: false                          # Set in Render dashboard > Environment
      - key: INTERNAL_API_KEY
        generateValue: true                  # Auto-generated by Render
      - key: CORS_ORIGINS
        value: '["https://pneumonia-hub.vercel.app","http://localhost:3000"]'
      - key: MAX_UPLOAD_BYTES
        value: "33554432"
      - key: UPLOAD_DIR
        value: "static/reports"
      - key: SAMPLES_DIR
        value: "static/samples"
